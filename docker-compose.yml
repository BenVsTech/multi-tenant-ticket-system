services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    # Redis password configuration:
    # - If REDIS_PASSWORD is set in .env or environment, Redis will require authentication
    # - For production, always set REDIS_PASSWORD
    # - For development, password is optional
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi
      "
    volumes:
      - redis-data:/data
    environment:
      # Optional: Set REDIS_PASSWORD in .env file or environment
      # If set, Redis will require authentication
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

volumes:
  redis-data: